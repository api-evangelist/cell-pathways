name: Cell Pathways
description: 'Cell Pathways, Inc. (CPI) was a development-stage pharmaceutical company
  headquartered at 702 Electronic Drive, Horsham, Pennsylvania, focused on the research
  and development of products to treat and prevent cancer. Incorporated in Delaware
  in July 1998 (as Cell Pathways Holdings, Inc., renamed Cell Pathways, Inc. in February
  2001), it developed a class of compounds it called selective apoptotic anti-neoplastic
  drugs (SAANDs), designed to induce selective apoptosis — programmed cell death —
  in precancerous and cancerous cells without affecting normal cells. Its lead candidate
  was Aptosyn (exisulind), studied in precancerous lesions such as colonic polyps and
  cervical dysplasia and later in prostate, lung, and breast cancer; the company also
  imported, promoted, and sold Gelclair Concentrated Oral Gel into oncology and dental
  markets, and had previously marketed Nilandron. It traded on the Nasdaq National
  Market (Commission File No. 000-24889) and employed approximately 34 people full-time
  as of March 1, 2003. In February 2003 Cell Pathways signed an Agreement and Plan
  of Merger to be acquired by OSI Pharmaceuticals, Inc. in a stock-for-stock exchange;
  stockholders approved the merger on June 10, 2003, and the company filed a Form 15-12G
  on June 12, 2003 terminating its Exchange Act registration with one holder of record.
  OSI Pharmaceuticals was itself acquired by Astellas Pharma and deregistered on June
  18, 2010. Cell Pathways predates the API economy entirely, never operated a developer
  program or public API surface, and no longer exists as an operating entity. This
  profile is retained as an acquired-company lead with no API surface to enrich.'
